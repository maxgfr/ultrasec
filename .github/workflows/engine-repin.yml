name: Engine re-pin

# Daily check for a new codeindex (https://github.com/maxgfr/codeindex) release.
# If the pinned engine is stale, re-pins it, rebuilds the bundle, and runs the
# same gates as ci.yml. All green -> pushed straight to main (a GITHUB_TOKEN
# push triggers no workflows, so release.yml/ci.yml are kicked off explicitly
# via workflow_dispatch). Any gate red -> nothing is pushed and no PR is
# opened; the run just fails and the next daily cron retries. A red run is
# the signal to investigate locally.
on:
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency: engine-repin

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Driven by `sync-engine.mjs --list` rather than by a copy of the engine
      # table kept here: adding an engine to the script is then the only edit
      # needed, and the automation cannot drift from the list it is watching.
      - name: Re-pin every engine that has a newer release
        id: detect
        run: |
          set -euo pipefail
          SUMMARY=""
          while read -r NAME REPO PINNED; do
            # NOT releases/latest: a repo may also publish non-engine asset
            # releases (codeindex publishes embed-model-v1), which are not tags
            # this can pin to.
            LATEST=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::could not determine the latest ${NAME} release tag"
              exit 1
            fi
            if [ "$PINNED" = "$LATEST" ]; then
              echo "${NAME}: up to date (${PINNED})"
              continue
            fi
            echo "${NAME}: ${PINNED} -> ${LATEST}"
            node scripts/sync-engine.mjs --engine "$NAME" --ref "$LATEST"
            SUMMARY="${SUMMARY}${NAME} ${PINNED} -> ${LATEST}"$'\n'
          done < <(node scripts/sync-engine.mjs --list)

          if [ -z "$SUMMARY" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              printf '%s' "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the vendored engines match their new pins
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/sync-engine.mjs --check

      - name: Configure git identity
        if: steps.detect.outputs.repin == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Typecheck
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run lint

      - name: Rebuild bundle (tsup + copy-bundle)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run build

      # The committed example audit is ENGINE OUTPUT: a new codeindex version
      # legitimately changes the graph it walks. Without regenerating it here,
      # `check:build`'s `build-example-audit --check` reports "stale: graph.json"
      # and every automatic re-pin fails — which is how this job came to be red on
      # a schedule while the vendored engine quietly stopped being updated. The
      # regenerated artifacts must be in the SAME commit as the bundle, since the
      # gate below diffs against HEAD.
      - name: Regenerate the example audit (engine output changes with the engine)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run build:example

      # tests/golden/*.json is engine output for the SAME reason assets/example-audit
      # is: the walk records what the engine can see, and a newer codeindex sees more
      # (v2.20.1 -> v2.27.1 added the enclosing `symbol` to every path step). Without
      # this, `pnpm test` fails on 12 golden mismatches and every automatic re-pin dies
      # there — which is exactly how the engine came to sit 7 releases behind.
      - name: Regenerate the goldens (engine output changes with the engine)
        if: steps.detect.outputs.repin == 'true'
        run: UPDATE_GOLDEN=1 pnpm test golden-findings

      # …but regenerating a regression gate on autopilot would destroy the thing it
      # guards, so the counts are compared against the committed set: enrichment and
      # ADDED findings pass, a fixture that LOSES findings fails the run and nothing
      # is pushed. Recall loss stays a human decision.
      - name: Guard — the regenerated goldens lost no findings
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/check-golden-recall.mjs

      # check:build's own git-diff gate compares the rebuilt bundle against
      # HEAD, so the rebuilt bundle has to be committed first (this repo's
      # local/CI flow: build, then commit, then check:build). On red gates
      # nothing is pushed — this commit never leaves the runner.
      - name: Commit re-pinned engine + rebuilt bundle
        if: steps.detect.outputs.repin == 'true'
        env:
          ENGINES: ${{ steps.detect.outputs.summary }}
        run: |
          git add src/vendor/engine.meta.json src/vendor/codeindex-engine.mjs src/vendor/codeindex-engine.d.mts scripts/ultrasec.mjs skills/ultrasec/scripts/ultrasec.mjs assets/example-audit tests/golden
          git commit -m "feat(engine): re-pin vendored engines" -m "Automated re-pin. Gates run next; this commit is the adjudication material regardless of outcome." -m "${ENGINES}"

      - name: Build is reproducible (committed bundle up to date)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run check:build

      - name: Test
        if: steps.detect.outputs.repin == 'true'
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/repin-test.log

      - name: Smoke-run the committed bundle (offline, fixture repo)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run demo:offline

      - name: Assert the audit dossier was produced
        if: steps.detect.outputs.repin == 'true'
        run: test -f /tmp/ultrasec-demo/findings.json && test -f /tmp/ultrasec-demo/DOSSIER.md

      - name: All gates green — finalize commit and push to main
        if: steps.detect.outputs.repin == 'true'
        id: push
        env:
          ENGINES: ${{ steps.detect.outputs.summary }}
        run: |
          SUMMARY=$(grep -E "Tests +[0-9]+ passed" /tmp/repin-test.log | tail -1)
          BODY=$(printf '%s%s\n' "${ENGINES}" "automated re-pin, all gates green. ${SUMMARY:-test summary unavailable}.")
          git commit --amend -m "feat(engine): re-pin vendored engines" -m "$BODY"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release workflow
        if: steps.detect.outputs.repin == 'true'
        run: gh workflow run release.yml --ref main

      - name: Trigger CI workflow
        if: steps.detect.outputs.repin == 'true'
        run: gh workflow run ci.yml --ref main

      # A red re-pin means this repo has stopped following the engine. Nothing
      # used to carry that signal out of the Actions tab, so ultrasec failed
      # three nights running in August before a human noticed. One open issue per
      # repo, a comment on each further failure, closed by the first green run.
      - name: Report the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create engine-repin --color B60205 --description "This automated pin needs a human" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          # Built with printf rather than a multi-line literal: this file's own
          # indentation would otherwise be carried into the body and render the
          # whole message as a code block.
          BODY=$(printf '%s\n\n%s\n' \
            "The daily engine-repin run failed: ${RUN}" \
            "Nothing was pushed, so main is not broken — the pin is simply frozen where it was, and this repo stays behind the engine until someone looks.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "${{ github.workflow }} is failing" --label engine-repin --body "$BODY"
          fi

      - name: Close the tracking issue once a run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then exit 0; fi
          gh issue close "$NUM" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
