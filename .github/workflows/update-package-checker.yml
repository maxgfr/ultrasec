name: Update package-checker

# package-checker.sh (src/vendor/package-checker.sh) is vendored and
# sha256-pinned. src/tools/package-checker.ts resolves upstream's latest
# release over the network at scan time and falls back to this vendored copy
# on ANY resolution failure — offline, rate-limited, or explicitly forced via
# ULTRASEC_PACKAGE_CHECKER_PINNED=1 (see that file's "Runtime
# latest-with-fallback resolution" comment) — so the vendored copy is the
# offline/failure path, not the only path, but it still needs to stay
# reasonably fresh. This workflow checks daily for a newer upstream release
# and re-pins it (regenerated bundles included). All gates green -> pushed
# straight to main; any gate red -> nothing is pushed, the run fails, and the
# next daily cron retries. Same shape as engine-repin.yml, deliberately.
#
# This job used to open a PR instead. That never worked on this repo: opening a
# PR from Actions requires the "Allow GitHub Actions to create and approve pull
# requests" setting, which is off, so from v1.11.4 to v1.11.38 every nightly run
# pushed its branch, failed on `gh pr create`, and left an orphan behind — 18 of
# them, while the pin silently rotted 34 releases behind. Pushing needs only
# `contents: write`, which this job already has, so the direct push is both the
# simpler and the less-privileged path: the alternative was granting Actions the
# right to create AND approve pull requests on a security tool's repo.
#
# What the push does NOT lose: the "Full repo gate" step below runs the SAME
# commands ci.yml runs — typecheck, test, lint, check:build — against the bumped
# state before anything leaves the runner. A PR would have added a review step
# nobody performs and a ci.yml run GITHUB_TOKEN cannot trigger anyway (GitHub's
# anti-recursion rule: a push authenticated by the default token starts no other
# workflow). That last point is why release.yml and ci.yml are dispatched
# explicitly at the end of the job.
#
# `secrets.PACKAGE_CHECKER_BUMP_TOKEN` is still honoured for checkout/gh when set
# (missing secrets evaluate to '' in Actions expressions, so `secrets.X ||
# github.token` is a documented fallback, not an error). With that PAT the push is
# authenticated as that account and ci.yml runs on it natively; without it the
# explicit dispatch below covers the same ground.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to kick off release.yml / ci.yml after the push (see the end of the job)

env:
  # See the GITHUB_TOKEN note above: falls back to the default token when
  # PACKAGE_CHECKER_BUMP_TOKEN isn't configured.
  GH_TOKEN: ${{ secrets.PACKAGE_CHECKER_BUMP_TOKEN || github.token }}

jobs:
  update-package-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the push step rebases onto origin/main before pushing,
          # which a shallow clone cannot do (engine-repin.yml does the same).
          fetch-depth: 0
          # See the GITHUB_TOKEN note above: this is what actually authenticates
          # the later `git push`, so it also decides whether the anti-recursion
          # rule applies to it.
          token: ${{ secrets.PACKAGE_CHECKER_BUMP_TOKEN || github.token }}

      - name: Decide whether a re-pin is needed
        id: decide
        run: |
          set -euo pipefail
          CURRENT="$(jq -r .tag src/vendor/package-checker.meta.json)"
          LATEST="$(gh api repos/maxgfr/package-checker.sh/releases/latest --jq .tag_name)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "package-checker is already pinned at $CURRENT — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "re-pin needed: $CURRENT -> $LATEST"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.decide.outputs.proceed == 'true'

      - uses: actions/setup-node@v6
        if: steps.decide.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.decide.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Re-pin package-checker.sh at the new tag
        if: steps.decide.outputs.proceed == 'true'
        run: node scripts/sync-package-checker.mjs --ref "${{ steps.decide.outputs.latest }}"

      - name: Rebuild both bundles (must ship with the re-pin or check:build fails it)
        if: steps.decide.outputs.proceed == 'true'
        run: pnpm run build

      - name: Stage the bumped state for commit
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No branch to create: the commit is made on the checked-out main and
          # pushed there once the gate below is green (see the header).
          # Staged BEFORE the full gate below runs, so check:build's own
          # `git diff --exit-code` over the two bundle paths compares its fresh
          # rebuild against this staged (bumped) content rather than against
          # stale pre-bump HEAD — i.e. it verifies byte-identity of the bumped
          # state, not "does the bump match what was here before the bump".
          git add src/vendor/package-checker.sh src/vendor/package-checker-script.ts src/vendor/package-checker.meta.json \
            scripts/ultrasec.mjs skills/ultrasec/scripts/ultrasec.mjs

      - name: Full repo gate (mirrors ci.yml — nothing is pushed unless this is green; see header)
        if: steps.decide.outputs.proceed == 'true'
        run: pnpm typecheck && pnpm test && pnpm run lint && pnpm run check:build

      # Pushed straight to main, like engine-repin.yml, and for the same reason:
      # the full repo gate above already ran the exact commands ci.yml runs
      # (typecheck, test, lint, check:build) against the bumped state, so a PR
      # would add a review step nobody performs and a CI run that GITHUB_TOKEN
      # cannot trigger anyway.
      #
      # It also removes a hard blocker. Opening a PR needs "Allow GitHub Actions
      # to create and approve pull requests", which is off on this repo — so from
      # v1.11.4 to v1.11.38 every nightly run pushed its branch, failed on
      # `gh pr create`, and left an orphan behind (18 of them). Pushing needs only
      # `contents: write`, which the job already has. On a red gate nothing is
      # pushed: the commit never leaves the runner and the next cron retries.
      - name: All gates green — push to main
        if: steps.decide.outputs.proceed == 'true'
        env:
          LATEST: ${{ steps.decide.outputs.latest }}
        run: |
          set -euo pipefail
          SHA_SH="$(jq -r '.sha256["package-checker.sh"]' src/vendor/package-checker.meta.json)"

          git commit -m "feat(deps): re-pin package-checker at ${LATEST}" \
            -m "Automated re-pin, all gates green (typecheck, lint, test, check:build). package-checker.sh sha256: ${SHA_SH}."
          git pull --rebase origin main
          git push origin HEAD:main

      # A GITHUB_TOKEN push triggers no workflows, so release.yml/ci.yml are kicked
      # off explicitly — same as engine-repin.yml.
      - name: Trigger release workflow
        if: steps.decide.outputs.proceed == 'true'
        run: gh workflow run release.yml --ref main

      - name: Trigger CI workflow
        if: steps.decide.outputs.proceed == 'true'
        run: gh workflow run ci.yml --ref main
