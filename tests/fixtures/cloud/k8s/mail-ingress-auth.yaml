apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailcatcher
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mailcatcher-basic-auth
spec:
  ingressClassName: nginx
  rules:
    - host: mail.staging.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailcatcher
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
    - host: shop.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-web
                port:
                  number: 80
