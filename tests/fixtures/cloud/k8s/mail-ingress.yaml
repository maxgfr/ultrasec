apiVersion: v1
kind: Service
metadata:
  name: mailcatcher
spec:
  selector:
    app: mailcatcher
  ports:
    - name: web
      port: 8025
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailcatcher
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
    - host: mail.staging.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailcatcher
                port:
                  name: web
